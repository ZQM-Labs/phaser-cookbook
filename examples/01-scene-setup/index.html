<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171923">
  <title>Phaser Cookbook — First Scene</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script defer src="./game.js"></script>
</head>
<body>
  <main>
    <h1>First playable scene</h1>
    <p id="instructions">Activate the play area by clicking, tapping, or pressing Enter or Space. Each activation advances the demo counter.</p>
    <div id="game-root"></div>
    <p id="game-status" role="status" aria-live="polite">Loading game…</p>
    <p class="note">This example draws its art with shapes. It needs network access to load the pinned Phaser development script.</p>
  </main>
</body>
</html>
