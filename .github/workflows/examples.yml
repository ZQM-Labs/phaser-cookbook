name: Cookbook examples

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phaser-cookbook-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scene-contract:
    name: First scene contract (Node.js 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/01-scene-setup
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run static contract tests
        run: npm test
